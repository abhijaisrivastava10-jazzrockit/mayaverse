<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mayaverse™</title>
<meta name="description" content="mayaverse. founder abhijai sriavstava, bangalore. built by jai.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#07060d;--ink:#efe9ff;--dim:#8f87ad;--violet:#b794f4;--gold:#e9b730;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:300 18px/1.6 "Fraunces",Georgia,serif;display:grid;place-items:center;overflow:hidden;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;text-align:center;display:grid;gap:10px}
h1{margin:0 0 10px;font:300 clamp(56px,14vw,148px)/.9 "Fraunces",Georgia,serif;letter-spacing:-.03em}
h1 i{color:var(--violet)}
.k{font:400 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
p{margin:0}
.dim{color:var(--dim)}
a{color:var(--ink)}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <h1>maya<i>verse</i><sup style="font-size:.28em;vertical-align:super;font-style:normal">™</sup></h1>
  <div class="k">founder</div>
  <p>abhijai sriavstava</p>
  <p>bangalore</p>
  <p>jazzrockit</p>
  <p><a href="https://www.instagram.com/abhijai.srivastava/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">instagram abhijai.srivastava</a></p>
  <p class="k dim" style="margin-top:14px">built by jai</p>
  <p class="k dim" style="margin-top:6px;font-size:10px">© 2026 Abhijai Srivastava (Jai). All rights reserved. mayaverse™ is a trademark of Abhijai Srivastava.</p>
  <p class="k dim" style="margin-top:2px;font-size:10px">No copying or reuse of this site or its content without written permission.</p>
</main>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H,S=[];
function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;S=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4*devicePixelRatio,t:Math.random()*6}))}
size();addEventListener("resize",size);
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(n){x.clearRect(0,0,W,H);for(const s of S){const a=calm?.6:.35+.35*Math.sin(n/1400+s.t);x.globalAlpha=a;x.fillStyle=s.t>5?"#b794f4":"#efe9ff";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}if(!calm)requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script>
</body>
</html>
